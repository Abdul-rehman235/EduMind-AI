<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - EduMind AI Academic Workspace</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Separate CSS File -->
    <link rel="stylesheet" href="/static/auth.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <h2>Create Account</h2>
                <p>Register for EduMind AI academic workspace</p>
            </div>

            <form onsubmit="handleRegister(event) " method="POST">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" id="reg-name" class="input-field" placeholder="Enter Your Name:" required>
                </div>

                <div class="form-group">
                    <label>Student Handle / Username</label>
                    <input type="text" name="username" id="reg-handle" class="input-field" placeholder="@Student" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" id="reg-email" class="input-field" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label>Secure Password</label>
                    <input type="password" name="password" id="reg-pass" class="input-field" placeholder="••••••••" required>
                </div>
                <form action="/register" method="POST">
                <button type="submit" class="btn-auth">Register & Continue</button>
        
                </a>
                </form>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="/login">Sign In</a>
            </div>
        </div>
    </div>


</body>
</html>
