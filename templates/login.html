<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - EduMind Academic Workspace</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Separate CSS File -->
    <link rel="stylesheet" href="/static/auth.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand-logo">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <h2>Welcome Back</h2>
                <p>Sign in to your EduMind academic workspace</p>
            </div>

            <form onsubmit="handleLogin(event)" method="POST">
                <div class="form-group">
                    <label>Email Address or Username</label>
                    <input type="text" name="username" id="login-id" class="input-field" placeholder="e.g. @domain.com" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" id="login-pass" class="input-field" placeholder="••••••••" required>
                </div>

                <form action="/login" method="POST">
                
                    <button type="submit" name="login" class="btn-auth">Access Workspace</button>
                </a>
                </form>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/register">Create Account</a>
            </div>
        </div>
    </div>

</body>
</html>
